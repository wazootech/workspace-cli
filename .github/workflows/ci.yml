name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Format, lint, import-alias lint, type check, manifest check and tests all
  # run on Bun (bun run ci). Bun floats on 1.x on purpose so a Bun regression
  # surfaces early. The publish dry run goes through the jsr CLI (a
  # devDependency that bundles its own publisher), so no Deno is installed
  # anywhere in CI.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run ci
      - run: bun run publish:dry
      - name: Contract lint self-test
        run: bash skills/contract-lint/lint_test.sh
      # The compiled `wspace` binary must build and answer a command.
      - run: bun run build
      - run: ./wspace --help | grep -q "wspace check"
