name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run ci
      # jsr (pinned in devDependencies) bundles its own Deno-based publisher and
      # downloads it on first use, so this runner needs no Deno install.
      - name: Publish dry run (smoke)
        run: bun run publish:dry
      # A push to main that does not bump jsr.json's version is routine (docs,
      # CI, refactors): skip the publish green with a notice instead of failing
      # main. A bumped version publishes. A published version is a JSR fact,
      # so ask JSR (meta.json lists every published version) rather than
      # trusting the tree.
      - name: Check whether this version is already on JSR
        id: guard
        run: |
          V=$(grep -m1 '"version"' jsr.json | sed 's/.*"\([^"]*\)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if curl -sf "https://jsr.io/@wazoo/workspace/meta.json" | grep -q "\"$V\""; then
            echo "::notice::Version $V of @wazoo/workspace is already on JSR; nothing to publish. Bump the version in jsr.json to release."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.guard.outputs.published == 'false'
        run: bunx jsr publish
